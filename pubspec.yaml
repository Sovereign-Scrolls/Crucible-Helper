name: crucible_helper
description: A utility app for LARP players to manage their character, death timer, and monster cores.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  crypto: ^3.0.3

  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_storage: ^13.0.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.2.2 
  qr_code_scanner_plus: ^2.0.10+1
  cloud_firestore: ^6.0.1
  url_launcher: ^6.2.5
  geolocator: ^14.0.2
  path_provider: ^2.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  vibration: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo cropped.png


fonts:
  - family: Cinzel
    fonts:
      - asset: assets/fonts/Cinzel-Regular.ttf